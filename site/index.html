<!doctype html>
<html lang="en" class="dark" data-theme="kata">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kata-ui</title>
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('kata-ui:appearance') || '{}')
        const root = document.documentElement
        if (saved.theme) root.dataset.theme = saved.theme
        const dark = saved.scheme === 'light' ? false : saved.scheme === 'dark' ? true : matchMedia('(prefers-color-scheme: dark)').matches
        root.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
